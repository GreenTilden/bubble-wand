[project]
name = "clawatch-bridge"
version = "0.1.0"
description = "Injection-safe HTTP bridge over tmux for the wrist co-pilot (Wear OS)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# `pip install -e '.[dev]'` then `pytest`. The parse tests are the regression net for the
# status-bar scan direction — a wrong ctxTokens sample becomes a wrong permanent log entry.
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clawatch_bridge"]
